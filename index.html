<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    
    <!-- Favicon & iOS Home Screen Icon -->
    <link rel="icon" type="image/png" href="whale.png">
    <link rel="apple-touch-icon" href="whale.png">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <i class="fa-solid fa-bars menu-icon"></i>
                PERSONAL DASHBOARD - <span id="headerProfileTitle">SOLLEHIN</span>
            </div>
            <div class="header-right">
                <select id="profileSelect" class="profile-select" onchange="switchProfile()">
                    <option value="sollehin">Sollehin</option>
                    <option value="syahirah">Syahirah</option>
                    <option value="iman_sayf">Iman Sayf</option>
                </select>
                <div class="user-avatar" id="userAvatarText">SO</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-grid">
            
            <!-- Left Column: Daily Schedule -->
            <section class="card">
                <div class="card-top-content">
                    <div class="card-header">
                        <i class="fa-regular fa-calendar"></i> DAILY SCHEDULE
                    </div>
                    <div class="card-subheader">
                        TODAY'S INTAKE LOG <i class="fa-regular fa-calendar"></i>
                    </div>

                    <div class="schedule-list empty" id="scheduleList">
                        <div style="color: var(--text-light); text-align: center; font-size: 14px;">
                            No food intake added yet. Click below to add.
                        </div>
                    </div>
                </div>

                <button class="btn-add-event" onclick="openFoodModal()">ADD FOOD INTAKE</button>
            </section>

            <!-- Right Column: Hydration Tracker -->
            <section class="card">
                <div>
                    <div class="card-header">
                        <i class="fa-solid fa-droplet" style="color: #0ea5e9;"></i> HYDRATION TRACKER
                    </div>
                    <div class="card-subheader">
                        DAILY WATER INTAKE <i class="fa-solid fa-droplet"></i>
                    </div>

                    <div class="hydration-stats">
                        <div class="bottle-container">
                            <!-- Dynamic Bottle Render Container -->
                            <div id="bottleContainerWrapper"></div>
                            <div style="font-size: 15px; font-weight: 600;" id="amountText">0.0L / 1.5L</div>
                        </div>
                        
                        <div class="water-info">
                            <div id="infoText">
                                <strong>TODAY'S GOAL:</strong>
                                1.5 Liters<br><br>
                                <strong>CURRENT:</strong>
                                0.0 L (0%)
                            </div>
                            <!-- Goal Reached & Extra Intake Indicator Badge -->
                            <div id="goalIndicator" class="goal-badge"></div>
                        </div>
                    </div>

                    <div class="quick-add-btns">
                        <button onclick="addWater(10)">+10ml</button>
                        <button onclick="addWater(30)">+30ml</button>
                        <button onclick="addWater(120)">+120ml</button>
                    </div>
                </div>

                <div class="history-list" id="hydrationHistory"></div>
            </section>

        </main>
    </div>

    <!-- Food Intake Form Modal Popup -->
    <div class="modal-overlay" id="foodModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Add Food Intake</span>
                <button class="modal-close" onclick="closeFoodModal()">&times;</button>
            </div>
            <form id="foodForm" onsubmit="handleFoodSubmit(event)">
                <div class="form-group">
                    <label for="foodSelect">Food / Meal Selection</label>
                    <select id="foodSelect" onchange="onFoodDropdownChange()" required>
                        <option value="" disabled selected>-- Choose suggested meal or snack --</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Snack">Snack</option>
                        <option value="Fresh Fruit">Fresh Fruit</option>
                        <option value="Beverage / Coffee">Beverage / Coffee</option>
                        <option value="custom">Other / Custom Meal...</option>
                    </select>
                </div>

                <!-- Custom Meal Input (Hidden by default) -->
                <div class="form-group" id="customFoodGroup" style="display: none;">
                    <label for="customFoodName">Custom Meal Name</label>
                    <input type="text" id="customFoodName" placeholder="Enter meal name">
                </div>

                <!-- Optional Food Details / Notes -->
                <div class="form-group">
                    <label for="foodDetails">Food Details / Notes <span style="font-weight: 400; color: #94a3b8;">(Optional)</span></label>
                    <input type="text" id="foodDetails" placeholder="e.g. Oatmeal with fruits & honey">
                </div>

                <div class="form-group">
                    <label for="foodTime">Time</label>
                    <input type="time" id="foodTime" required>
                </div>

                <div class="form-group">
                    <label for="foodCalories">Estimated Calories (kcal) <span style="font-weight: 400; color: #94a3b8;">(Optional)</span></label>
                    <input type="number" id="foodCalories" placeholder="e.g. 250">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeFoodModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Add Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- External Script File -->
    <script src="script.js"></script>
</body>
</html>
