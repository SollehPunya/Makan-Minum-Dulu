<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading PnL Calendar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#EEF3F2',
                        cardBg: '#FFFFFF',
                        primary: '#437699',
                        primaryHover: '#376380',
                        profit: '#10B981',
                        loss: '#EF4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-appBg text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- PIN Lock Screen Overlay -->
    <div id="pin-lock-screen" class="fixed inset-0 bg-appBg z-50 flex flex-col justify-center items-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-xs border border-gray-100 flex flex-col items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-[#437699]/10 text-primary flex items-center justify-center text-xl font-bold shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div class="text-center">
                <h2 class="text-gray-800 font-bold text-lg">Enter Security PIN</h2>
                <p class="text-xs text-gray-400 mt-0.5">Default PIN is <span class="font-semibold text-gray-600">1234</span></p>
            </div>
            
            <!-- PIN Dots Display -->
            <div class="flex gap-3 my-2">
                <div class="w-4 h-4 rounded-full border-2 border-primary dot-1 transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-primary dot-2 transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-primary dot-3 transition-all duration-200"></div>
                <div class="w-4 h-4 rounded-full border-2 border-primary dot-4 transition-all duration-200"></div>
            </div>

            <div id="pin-error" class="text-xs text-red-500 h-4 text-center font-medium"></div>

            <!-- Keypad -->
            <div class="grid grid-cols-3 gap-3 w-full">
                <button onclick="pressPin('1')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">1</button>
                <button onclick="pressPin('2')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">2</button>
                <button onclick="pressPin('3')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">3</button>
                <button onclick="pressPin('4')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">4</button>
                <button onclick="pressPin('5')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">5</button>
                <button onclick="pressPin('6')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">6</button>
                <button onclick="pressPin('7')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">7</button>
                <button onclick="pressPin('8')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">8</button>
                <button onclick="pressPin('9')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">9</button>
                <button onclick="clearPin()" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-semibold text-gray-400 text-xs transition">Clear</button>
                <button onclick="pressPin('0')" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-bold text-gray-700 text-lg transition">0</button>
                <button onclick="deletePin()" class="bg-gray-50 hover:bg-gray-100 active:scale-95 py-3 rounded-2xl font-semibold text-gray-500 text-sm transition"><i class="fa-solid fa-delete-left"></i></button>
            </div>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-100 p-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-3">
            <h1 class="text-base sm:text-lg font-bold flex items-center gap-2 text-gray-800 tracking-wide">
                <i class="fa-solid fa-chart-line text-primary"></i> PNL CALENDAR
            </h1>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Account Selector & Actions -->
                <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5">
                    <select id="account-select" onchange="switchAccount(this.value)" class="bg-transparent text-xs sm:text-sm font-semibold text-gray-700 focus:outline-none cursor-pointer">
                        <!-- Populated by JS -->
                    </select>
                    <button onclick="openAddAccountModal()" title="Add Account" class="text-primary hover:text-primaryHover text-xs px-1.5 py-1 rounded-lg bg-white shadow-xs border border-gray-100 transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <button onclick="deleteCurrentAccount()" title="Delete Account" class="text-red-500 hover:text-red-600 text-xs px-1.5 py-1 rounded-lg bg-white shadow-xs border border-gray-100 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>

                <button onclick="lockApp()" title="Lock Page" class="text-gray-400 hover:text-gray-600 transition bg-gray-50 p-2 rounded-full w-9 h-9 flex items-center justify-center">
                    <i class="fa-solid fa-lock text-sm"></i>
                </button>
                <div class="bg-emerald-500 text-white font-bold w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm">
                    SO
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

        <!-- Dashboard Summary Cards -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-gray-400 font-medium">Total PnL</p>
                <p id="summary-total" class="text-lg sm:text-xl font-bold mt-1 text-gray-800">$0.00</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-gray-400 font-medium">Win Rate</p>
                <p id="summary-winrate" class="text-lg sm:text-xl font-bold mt-1 text-gray-800">0%</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-gray-400 font-medium">Wins / Losses</p>
                <p id="summary-w-l" class="text-lg sm:text-xl font-bold mt-1 text-gray-800">0 / 0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                <p class="text-xs text-gray-400 font-medium">Best Day</p>
                <p id="summary-best" class="text-lg sm:text-xl font-bold text-profit mt-1">$0.00</p>
            </div>
        </section>

        <!-- Monthly Goal Tracker Card -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center text-sm font-bold">
                        <i class="fa-solid fa-bullseye"></i>
                    </div>
                    <div>
                        <h3 class="text-xs sm:text-sm font-bold text-gray-800">Monthly Profit Goal</h3>
                        <p id="goal-text-status" class="text-[11px] text-gray-400">$0.00 / $0.00 (0%)</p>
                    </div>
                </div>
                <button onclick="openGoalModal()" class="bg-gray-50 hover:bg-gray-100 text-gray-600 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                    Set Goal
                </button>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                <div id="goal-progress-bar" class="bg-primary h-full transition-all duration-500 w-0"></div>
            </div>
        </section>

        <!-- Calendar Container Card -->
        <section class="bg-white p-4 sm:p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-5">
            <!-- Navigation header -->
            <div class="flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <button onclick="changeMonth(-1)" class="bg-gray-50 hover:bg-gray-100 text-gray-700 px-3 sm:px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-left text-xs"></i> Prev
                    </button>
                    <h2 id="month-year-display" class="text-base sm:text-lg font-bold text-gray-800">Month Year</h2>
                    <button onclick="changeMonth(1)" class="bg-gray-50 hover:bg-gray-100 text-gray-700 px-3 sm:px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
                        Next <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <!-- Weekend Toggle Button -->
                <button onclick="toggleWeekends()" id="weekend-toggle-btn" class="bg-gray-50 hover:bg-gray-100 text-gray-600 border border-gray-200 px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-week text-primary"></i> <span id="weekend-btn-text">Hide Weekends</span>
                </button>
            </div>

            <!-- Days of the Week Header -->
            <div id="days-header" class="grid grid-cols-7 gap-1.5 text-center text-xs font-semibold text-gray-400">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>

            <!-- Calendar Grid Days -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-1.5">
                <!-- Javascript will inject days here -->
            </div>
        </section>
    </main>

    <!-- Edit/Add PnL Modal -->
    <div id="pnl-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center p-4 z-50">
        <div class="bg-white border border-gray-100 rounded-3xl w-full max-w-sm p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 id="modal-date-title" class="font-bold text-base text-gray-800">Edit Date</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-gray-500">PnL Amount ($)</label>
                <input type="number" id="modal-pnl-input" step="any" placeholder="e.g. 150.50 or -45.00" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 text-sm focus:outline-none focus:border-primary transition">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-gray-500">Notes (Optional)</label>
                <textarea id="modal-notes-input" placeholder="Setup used, psychology, market notes..." rows="3" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 text-sm focus:outline-none focus:border-primary transition resize-none"></textarea>
            </div>

            <div class="flex gap-2 mt-2">
                <button onclick="savePnL()" class="flex-1 bg-primary hover:bg-primaryHover text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm">Save Entry</button>
                <button onclick="deletePnL()" class="bg-red-50 text-red-500 hover:bg-red-100 px-4 py-3 rounded-xl transition"><i class="fa-solid fa-trash text-sm"></i></button>
            </div>
        </div>
    </div>

    <!-- Set Goal Modal -->
    <div id="goal-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center p-4 z-50">
        <div class="bg-white border border-gray-100 rounded-3xl w-full max-w-sm p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-gray-800">Set Monthly Goal</h3>
                <button onclick="closeGoalModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label id="goal-modal-label" class="text-xs font-medium text-gray-500">Target Profit ($)</label>
                <input type="number" id="modal-goal-input" step="any" placeholder="e.g. 2000" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 text-sm focus:outline-none focus:border-primary transition">
            </div>

            <button onclick="saveGoal()" class="w-full bg-primary hover:bg-primaryHover text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm mt-2">Save Goal</button>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div id="account-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden justify-center items-center p-4 z-50">
        <div class="bg-white border border-gray-100 rounded-3xl w-full max-w-sm p-6 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-gray-800">Add New Account</h3>
                <button onclick="closeAddAccountModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-gray-500">Account Name</label>
                <input type="text" id="modal-account-input" placeholder="e.g. Funded Account, Crypto Vault" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 text-sm focus:outline-none focus:border-primary transition">
            </div>

            <button onclick="createAccount()" class="w-full bg-primary hover:bg-primaryHover text-white py-3 rounded-xl font-semibold text-sm transition shadow-sm mt-2">Create Account</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // PIN Logic
        let enteredPin = '';
        const correctPin = '1234';

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if (enteredPin.length === 4) {
                    verifyPin();
                }
            }
        }

        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
            document.getElementById('pin-error').innerText = '';
        }

        function clearPin() {
            enteredPin = '';
            updatePinDots();
            document.getElementById('pin-error').innerText = '';
        }

        function updatePinDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.querySelector(`.dot-${i}`);
                if (i <= enteredPin.length) {
                    dot.classList.add('bg-primary', 'border-primary');
                } else {
                    dot.classList.remove('bg-primary', 'border-primary');
                }
            }
        }

        function verifyPin() {
            if (enteredPin === correctPin) {
                document.getElementById('pin-lock-screen').classList.add('hidden');
            } else {
                document.getElementById('pin-error').innerText = 'Incorrect PIN. Default is 1234';
                enteredPin = '';
                updatePinDots();
            }
        }

        function lockApp() {
            enteredPin = '';
            updatePinDots();
            document.getElementById('pin-error').innerText = '';
            document.getElementById('pin-lock-screen').classList.remove('hidden');
        }

        // App Data Initialization
        let appData = JSON.parse(localStorage.getItem('pnl_app_data')) || {
            accounts: {
                "Main Account": { data: {}, goals: {} }
            },
            currentAccount: "Main Account",
            showWeekends: true
        };

        function saveAppData() {
            localStorage.setItem('pnl_app_data', JSON.stringify(appData));
        }

        function getCurrentAccount() {
            if (!appData.accounts[appData.currentAccount]) {
                appData.currentAccount = Object.keys(appData.accounts)[0] || "Main Account";
            }
            return appData.accounts[appData.currentAccount];
        }

        let currentDate = new Date();
        let selectedDateStr = '';

        function initApp() {
            populateAccountDropdown();
            updateWeekendButtonUI();
            renderCalendar();
            updateSummary();
            updateGoalDisplay();
        }

        function populateAccountDropdown() {
            const select = document.getElementById('account-select');
            select.innerHTML = '';
            Object.keys(appData.accounts).forEach(accName => {
                const opt = document.createElement('option');
                opt.value = accName;
                opt.innerText = accName;
                if (accName === appData.currentAccount) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function switchAccount(accName) {
            appData.currentAccount = accName;
            saveAppData();
            renderCalendar();
            updateSummary();
            updateGoalDisplay();
        }

        function openAddAccountModal() {
            document.getElementById('modal-account-input').value = '';
            const modal = document.getElementById('account-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAddAccountModal() {
            const modal = document.getElementById('account-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function createAccount() {
            const name = document.getElementById('modal-account-input').value.trim();
            if (name && !appData.accounts[name]) {
                appData.accounts[name] = { data: {}, goals: {} };
                appData.currentAccount = name;
                saveAppData();
                populateAccountDropdown();
                closeAddAccountModal();
                renderCalendar();
                updateSummary();
                updateGoalDisplay();
            } else if (appData.accounts[name]) {
                alert('Account name already exists.');
            }
        }

        function deleteCurrentAccount() {
            const accountKeys = Object.keys(appData.accounts);
            if (accountKeys.length <= 1) {
                alert("You cannot delete the last remaining account.");
                return;
            }
            if (confirm(`Are you sure you want to delete the account "${appData.currentAccount}"? All its data and goals will be lost.`)) {
                delete appData.accounts[appData.currentAccount];
                appData.currentAccount = Object.keys(appData.accounts)[0];
                saveAppData();
                populateAccountDropdown();
                renderCalendar();
                updateSummary();
                updateGoalDisplay();
            }
        }

        function toggleWeekends() {
            appData.showWeekends = !appData.showWeekends;
            saveAppData();
            updateWeekendButtonUI();
            renderCalendar();
        }

        function updateWeekendButtonUI() {
            const btnText = document.getElementById('weekend-btn-text');
            btnText.innerText = appData.showWeekends ? "Hide Weekends" : "Show Weekends";
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-year-display').innerText = `${months[month]} ${year}`;

            const totalDays = new Date(year, month + 1, 0).getDate();
            const grid = document.getElementById('calendar-grid');
            const daysHeader = document.getElementById('days-header');
            const accData = getCurrentAccount().data;

            grid.innerHTML = '';

            if (appData.showWeekends) {
                daysHeader.className = "grid grid-cols-7 gap-1.5 text-center text-xs font-semibold text-gray-400";
                daysHeader.innerHTML = `<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>`;
                grid.className = "grid grid-cols-7 gap-1.5";

                const firstDayIndex = new Date(year, month, 1).getDay();
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'min-h-[90px] sm:min-h-[110px] bg-gray-50/50 rounded-xl opacity-20';
                    grid.appendChild(emptyCell);
                }

                for (let day = 1; day <= totalDays; day++) {
                    const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    appendDayCell(grid, day, dayStr, accData);
                }
            } else {
                daysHeader.className = "grid grid-cols-5 gap-1.5 text-center text-xs font-semibold text-gray-400";
                daysHeader.innerHTML = `<div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div>`;
                grid.className = "grid grid-cols-5 gap-1.5";

                let firstRenderedDayOfWeek = null;
                for (let day = 1; day <= totalDays; day++) {
                    let d = new Date(year, month, day).getDay();
                    if (d !== 0 && d !== 6) {
                        firstRenderedDayOfWeek = (d === 0 ? 6 : d - 1);
                        break;
                    }
                }

                if (firstRenderedDayOfWeek !== null) {
                    for (let i = 0; i < firstRenderedDayOfWeek; i++) {
                        const emptyCell = document.createElement('div');
                        emptyCell.className = 'min-h-[90px] sm:min-h-[110px] bg-gray-50/50 rounded-xl opacity-20';
                        grid.appendChild(emptyCell);
                    }
                }

                for (let day = 1; day <= totalDays; day++) {
                    let d = new Date(year, month, day).getDay();
                    if (d === 0 || d === 6) continue;
                    const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    appendDayCell(grid, day, dayStr, accData);
                }
            }
        }

        function appendDayCell(grid, day, dayStr, accData) {
            const cell = document.createElement('div');
            cell.className = 'min-h-[90px] sm:min-h-[110px] bg-gray-50 border border-gray-100 rounded-xl p-2 flex flex-col justify-between cursor-pointer hover:border-gray-300 transition relative overflow-hidden group';
            cell.onclick = () => openModal(dayStr);

            let entry = accData[dayStr];
            let pnlHtml = '';
            let notesHtml = '';
            let bgStyle = '';

            if (entry !== undefined && entry.pnl !== '') {
                const val = parseFloat(entry.pnl);
                if (val > 0) {
                    bgStyle = 'bg-profit/10 border-profit/30';
                    pnlHtml = `<span class="text-sm sm:text-lg font-bold text-profit">+$${val.toFixed(2)}</span>`;
                } else if (val < 0) {
                    bgStyle = 'bg-loss/10 border-loss/30';
                    pnlHtml = `<span class="text-sm sm:text-lg font-bold text-loss">-$${Math.abs(val).toFixed(2)}</span>`;
                } else {
                    pnlHtml = `<span class="text-sm sm:text-lg font-bold text-gray-400">$0.00</span>`;
                }
                cell.className += ` ${bgStyle}`;

                if (entry.notes && entry.notes.trim() !== '') {
                    notesHtml = `<span class="text-[10px] sm:text-xs text-gray-500 font-medium truncate max-w-[90%] px-1.5 py-0.5 bg-white/70 rounded mt-1 shadow-2xs">${entry.notes}</span>`;
                }
            }

            cell.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="text-xs text-gray-500 font-semibold">${day}</span>
                </div>
                <div class="flex flex-col items-center justify-center flex-1 my-1">
                    ${pnlHtml}
                    ${notesHtml}
                </div>
            `;
            grid.appendChild(cell);
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
            updateSummary();
            updateGoalDisplay();
        }

        function openModal(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('modal-date-title').innerText = `Date: ${dateStr}`;
            
            const accData = getCurrentAccount().data;
            const entry = accData[dateStr] || { pnl: '', notes: '' };
            document.getElementById('modal-pnl-input').value = entry.pnl;
            document.getElementById('modal-notes-input').value = entry.notes || '';

            const modal = document.getElementById('pnl-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('pnl-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function savePnL() {
            const pnlVal = document.getElementById('modal-pnl-input').value;
            const notesVal = document.getElementById('modal-notes-input').value;
            const accData = getCurrentAccount().data;

            if (pnlVal === '') {
                delete accData[selectedDateStr];
            } else {
                accData[selectedDateStr] = {
                    pnl: parseFloat(pnlVal),
                    notes: notesVal
                };
            }

            saveAppData();
            closeModal();
            renderCalendar();
            updateSummary();
            updateGoalDisplay();
        }

        function deletePnL() {
            const accData = getCurrentAccount().data;
            delete accData[selectedDateStr];
            saveAppData();
            closeModal();
            renderCalendar();
            updateSummary();
            updateGoalDisplay();
        }

        function openGoalModal() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
            const acc = getCurrentAccount();
            const goalVal = acc.goals && acc.goals[monthKey] ? acc.goals[monthKey] : '';

            document.getElementById('modal-goal-input').value = goalVal;
            const modal = document.getElementById('goal-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGoalModal() {
            const modal = document.getElementById('goal-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function saveGoal() {
            const val = document.getElementById('modal-goal-input').value;
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            const acc = getCurrentAccount();
            if (!acc.goals) acc.goals = {};

            if (val === '' || parseFloat(val) <= 0) {
                delete acc.goals[monthKey];
            } else {
                acc.goals[monthKey] = parseFloat(val);
            }

            saveAppData();
            closeGoalModal();
            updateGoalDisplay();
        }

        function updateSummary() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const accData = getCurrentAccount().data;
            
            let totalPnL = 0;
            let wins = 0;
            let losses = 0;
            let bestDay = 0;

            Object.keys(accData).forEach(dateStr => {
                const [y, m] = dateStr.split('-').map(Number);
                if (y === year && (m - 1) === month) {
                    const val = parseFloat(accData[dateStr].pnl);
                    if (!isNaN(val)) {
                        totalPnL += val;
                        if (val > 0) {
                            wins++;
                            if (val > bestDay) bestDay = val;
                        } else if (val < 0) {
                            losses++;
                        }
                    }
                }
            });

            const totalTrades = wins + losses;
            const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;

            const totalEl = document.getElementById('summary-total');
            totalEl.innerText = (totalPnL >= 0 ? '+' : '') + `$${totalPnL.toFixed(2)}`;
            totalEl.className = `text-lg sm:text-xl font-bold mt-1 ${totalPnL >= 0 ? 'text-profit' : 'text-loss'}`;

            document.getElementById('summary-winrate').innerText = `${winRate}%`;
            document.getElementById('summary-w-l').innerText = `${wins} / ${losses}`;
            
            const bestEl = document.getElementById('summary-best');
            bestEl.innerText = `+$${bestDay.toFixed(2)}`;
        }

        function updateGoalDisplay() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            const acc = getCurrentAccount();
            const goal = (acc.goals && acc.goals[monthKey]) ? acc.goals[monthKey] : 0;

            let totalPnL = 0;
            Object.keys(acc.data).forEach(dateStr => {
                const [y, m] = dateStr.split('-').map(Number);
                if (y === year && (m - 1) === month) {
                    const val = parseFloat(acc.data[dateStr].pnl);
                    if (!isNaN(val)) totalPnL += val;
                }
            });

            let percent = 0;
            if (goal > 0) {
                percent = Math.max(0, Math.min(100, (totalPnL / goal) * 100));
            }

            document.getElementById('goal-text-status').innerText = `$${totalPnL.toFixed(2)} / $${goal.toFixed(2)} (${percent.toFixed(1)}%)`;
            document.getElementById('goal-progress-bar').style.width = `${percent}%`;
        }

        initApp();
    </script>
</body>
</html>
